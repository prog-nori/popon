# Opt-in LOCAL overlay: docker compose -f compose.yaml -f compose.pot.yaml ...
services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-node@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
    init: true
    restart: unless-stopped
    # No published ports. Internal BOT connection + default network for egress
    # to YouTube/Google; an internal:true network alone cannot generate tokens.
    networks: [pot, default]
    logging:
      driver: none
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4416/ping',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  popon:
    image: popon:po-token-local
    build:
      args:
        YT_DLP_SPEC: yt-dlp[default]==2026.10.26
        POT_PLUGIN_SPEC: bgutil-ytdlp-pot-provider==2.0.2
    environment:
      YOUTUBE_POT_ENABLED: ${YOUTUBE_POT_ENABLED:-true}
      YOUTUBE_POT_BASE_URL: http://pot-provider:4416
      YT_DLP_PATH: /opt/media/bin/yt-dlp
      FFMPEG_PATH: ffmpeg
      # This overlay must never contact AWS, even if .env contains AWS settings.
      SQS_QUEUE_URL: ""
      AUTO_STOP_ENABLED: "false"
      AUTO_STOP_COORDINATED: "false"
      ECS_STOP_ON_FATAL: "false"
    networks: [default, tts, pot]
    depends_on:
      pot-provider:
        condition: service_healthy
networks:
  pot:
    internal: true
