# ローカルとサーバーで共有するVOICEVOX定義。
services:
  voicevox:
    # CPU / Ubuntu 24.04 / 0.26.0。AMD64とARM64を含む公式manifestを固定。
    image: voicevox/voicevox_engine:cpu-ubuntu24.04-0.26.0@sha256:6c6c07dfebc34294b432864cfce4387738dfa840d3b1a2859e68486b2bd99807
    restart: unless-stopped
    healthcheck:
      # 公式イメージにはpython3/curl/wgetがないためbash組込みでHTTPを確認。
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/50021
          printf 'GET /version HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r protocol status rest <&3
          test "$$status" = 200
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
